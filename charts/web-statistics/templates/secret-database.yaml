{{- if .Values.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web-statistics.databaseSecretName" . }}
  labels:
    {{- include "web-statistics.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKeys.host }}: {{ required "database.host is required when database.existingSecret is empty" .Values.database.host | quote }}
  {{ .Values.database.secretKeys.port }}: {{ .Values.database.port | quote }}
  {{ .Values.database.secretKeys.name }}: {{ .Values.database.name | quote }}
  {{ .Values.database.secretKeys.user }}: {{ required "database.user is required when database.existingSecret is empty" .Values.database.user | quote }}
  {{ .Values.database.secretKeys.password }}: {{ required "database.password is required when database.existingSecret is empty" .Values.database.password | quote }}
  {{ .Values.database.secretKeys.sslMode }}: {{ .Values.database.sslMode | quote }}
{{- end }}
