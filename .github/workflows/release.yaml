name: Release changed components

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit used to detect changed components
        required: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  REGISTRY: europe-west3-docker.pkg.dev
  PROJECT_ID: bnbdevelopment
  REPOSITORY: webstats

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip cd]') }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.release.outputs.changed }}
      images: ${{ steps.release.outputs.images }}
      chart: ${{ steps.release.outputs.chart }}
      releases: ${{ steps.release.outputs.releases }}
      commit: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select components, bump versions, and push
        id: release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BASE: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          base="${INPUT_BASE:-$EVENT_BEFORE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="${GITHUB_SHA}^"
          fi

          for attempt in 1 2 3; do
            output="$(mktemp)"
            scripts/bump-versions.sh "$base" "$GITHUB_SHA" "$output"
            if grep -qx 'changed=false' "$output"; then
              cat "$output" >> "$GITHUB_OUTPUT"
              echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add backend/VERSION frontend/package.json frontend/package-lock.json \
              charts/web-statistics/Chart.yaml charts/web-statistics/values.yaml
            git commit -m "chore(release): bump affected components [skip cd]"
            if git push origin HEAD:main; then
              cat "$output" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$attempt" == 3 ]]; then
              echo "Could not push version commit after three attempts." >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
          done

  images:
    name: Publish ${{ matrix.component }} image
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.prepare.outputs.images) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Read component version
        id: version
        shell: bash
        run: |
          if [[ "${{ matrix.component }}" == backend ]]; then
            version="$(cat backend/VERSION)"
          else
            version="$(node -p "require('./frontend/package.json').version")"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.component }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true

  chart:
    name: Publish Helm chart
    needs: [prepare, images]
    if: >-
      ${{ always() && needs.prepare.outputs.chart == 'true' &&
          (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}

      - name: Login Helm to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "$ACCESS_TOKEN" | \
            helm registry login "$REGISTRY" --username oauth2accesstoken --password-stdin

      - name: Validate, package, and push chart
        run: |
          set -euo pipefail
          helm lint charts/web-statistics
          helm package charts/web-statistics --destination dist
          helm push dist/web-statistics-*.tgz \
            "oci://${REGISTRY}/${PROJECT_ID}/${REPOSITORY}"

  releases:
    name: Release ${{ matrix.release.tag }}
    needs: [prepare, images, chart]
    if: >-
      ${{ always() && needs.prepare.outputs.changed == 'true' &&
          (needs.images.result == 'success' || needs.images.result == 'skipped') &&
          (needs.chart.result == 'success' || needs.chart.result == 'skipped') }}
    strategy:
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.prepare.outputs.releases) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Create component release with generated commit notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMPONENT: ${{ matrix.release.component }}
          RELEASE_TAG: ${{ matrix.release.tag }}
          RELEASE_VERSION: ${{ matrix.release.version }}
          TARGET_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list "${RELEASE_COMPONENT}-v*" --sort=-version:refname | head -n 1)"
          notes_args=()
          if [[ -n "$previous_tag" ]]; then
            notes_args+=(--notes-start-tag "$previous_tag")
          fi
          gh release create "$RELEASE_TAG" \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_COMPONENT $RELEASE_VERSION" \
            --generate-notes "${notes_args[@]}"
